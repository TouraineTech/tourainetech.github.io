[build]
  publish = "dist"
  # `pnpm build` déclenche le hook `prebuild` (planning:build + extract:timerDatas)
  # qui régénère les données dans src/data + public/timer avant `astro build`.
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
